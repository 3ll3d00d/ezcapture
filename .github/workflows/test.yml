name: test

on:
  push:
    branches:
        - main
        - 'feature/*'
  workflow_dispatch:
    branches: ['*']

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        configuration: [ Debug, Release, ReleaseTrace, ReleaseNoArch, ReleaseTraceNoArch ]

    steps:
    - uses: actions/checkout@v7

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v3

    - name: Setup vcpkg for mwcapture
      uses: lukka/run-vcpkg@v11
      with:
        vcpkgJsonGlob: 'mwcapture/vcpkg.json'
        vcpkgConfigurationJsonGlob: 'mwcapture/vcpkg-configuration.json'
        
    - name: Setup vcpkg for mwcapture-test
      uses: lukka/run-vcpkg@v11
      with:
        vcpkgJsonGlob: 'mwcapture-test/vcpkg.json'      
        vcpkgConfigurationJsonGlob: 'mwcapture-test/vcpkg-configuration.json'

    - name: vcpkg integrate 
      run: vcpkg integrate install
      
    - name: Build
      working-directory: ${{ env.GITHUB_WORKSPACE }}
      run: |
        msbuild /t:Rebuild /p:Configuration=${{ matrix.configuration }}

    - name: Upload build artifacts
      uses: actions/upload-artifact@v7
      with:
        name: msbuild-${{ matrix.configuration }}
        path: x64/${{ matrix.configuration }}/**
        if-no-files-found: warn

    # The solution builds mwcapture-test in Debug/Release/ReleaseNoArch only; the
    # *Trace* solution configs map onto the matching non-trace test build.
    - name: Run tests
      shell: pwsh
      run: |
        $cfg = switch ('${{ matrix.configuration }}') {
          'ReleaseTrace'       { 'Release' }
          'ReleaseTraceNoArch' { 'ReleaseNoArch' }
          default              { '${{ matrix.configuration }}' }
        }
        & "x64\$cfg\mwcapture-test.exe"
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  build-cmake:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        preset: [ debug, release, release-noarch, release-trace, release-trace-noarch ]

    steps:
    - uses: actions/checkout@v7

    - name: Setup MSVC dev environment
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64

    - name: Ensure vcpkg toolchain present
      shell: pwsh
      run: |
        if (-not (Test-Path "C:\vcpkg\scripts\buildsystems\vcpkg.cmake")) {
          git clone https://github.com/microsoft/vcpkg C:\vcpkg
          C:\vcpkg\bootstrap-vcpkg.bat -disableMetrics
        }

    - name: Configure (${{ matrix.preset }})
      run: cmake --preset ${{ matrix.preset }}

    - name: Build (${{ matrix.preset }})
      run: cmake --build --preset ${{ matrix.preset }}

    - name: Upload build artifacts
      uses: actions/upload-artifact@v7
      with:
        name: cmake-${{ matrix.preset }}
        path: out/build/${{ matrix.preset }}/x64/**
        if-no-files-found: warn

    - name: Run tests (${{ matrix.preset }})
      shell: pwsh
      run: |
        $cfg = if ('${{ matrix.preset }}' -eq 'debug') { 'Debug' } else { 'Release' }
        & "out\build\${{ matrix.preset }}\x64\$cfg\mwcapture-test.exe"
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
